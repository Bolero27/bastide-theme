# Bastide: a dark, game-HUD style theme for Home Assistant.
# Pairs with Bastide Cards (https://github.com/Bolero27/bastide-cards),
# which read `bastide-style: hud` to switch to slanted shapes and load the fonts.

Bastide:
  # Bastide Cards
  bastide-style: hud
  bastide-orange: "#f99e1a"
  bastide-blue: "#3fa9f5"
  bastide-pink: "#ff5fa2"
  bastide-violet: "#a68bff"
  bastide-teal: "#2ee6c5"
  bastide-yellow: "#ffd84d"
  bastide-green: "#4ade80"
  bastide-steel: "#8fb3e8"

  # Fonts (loaded by Bastide Cards; Roboto is the fallback)
  ha-font-family-body: "Barlow, Roboto, Noto, sans-serif"
  ha-font-family-heading: "'Barlow Condensed', Barlow, Roboto, sans-serif"
  ha-card-header-font-family: "'Barlow Condensed', Barlow, Roboto, sans-serif"

  # Main colours
  primary-color: "#f99e1a"
  accent-color: "#3fa9f5"
  primary-background-color: "#0b111c"
  secondary-background-color: "#151d2c"
  primary-text-color: "#f3f6fb"
  secondary-text-color: "#9aa6bd"
  text-primary-color: "#0b111c"
  disabled-text-color: "#5b6782"
  divider-color: "#26314a"
  error-color: "#ff5f5f"
  warning-color: "#ffd84d"
  success-color: "#4ade80"
  info-color: "#3fa9f5"
  rgb-primary-color: "249, 158, 26"
  rgb-accent-color: "63, 169, 245"
  rgb-primary-text-color: "243, 246, 251"
  rgb-secondary-text-color: "154, 166, 189"
  rgb-text-primary-color: "11, 17, 28"
  rgb-card-background-color: "21, 29, 44"

  # Cards: square corners, no shadow
  card-background-color: "#151d2c"
  ha-card-background: "#151d2c"
  ha-card-border-radius: "0px"
  ha-card-border-width: "0px"
  ha-card-box-shadow: "none"

  # Header and sidebar
  app-header-background-color: "#0b111c"
  app-header-text-color: "#f3f6fb"
  app-header-border-bottom: "3px solid #f99e1a"
  sidebar-background-color: "#0b111c"
  sidebar-text-color: "#c5cede"
  sidebar-icon-color: "#9aa6bd"
  sidebar-selected-text-color: "#f99e1a"
  sidebar-selected-icon-color: "#f99e1a"

  # Entity states
  state-icon-color: "#9aa6bd"
  state-active-color: "#f99e1a"
  state-switch-active-color: "#f99e1a"
  state-light-active-color: "#ffd84d"
  state-climate-heat-color: "#f99e1a"
  state-climate-cool-color: "#3fa9f5"
  state-climate-dry-color: "#2ee6c5"
  state-climate-heat-cool-color: "#ffd84d"
  state-climate-auto-color: "#a68bff"

  # Inputs, chips, tables
  input-fill-color: "#1c2638"
  input-ink-color: "#f3f6fb"
  input-label-ink-color: "#9aa6bd"
  input-idle-line-color: "#3a4660"
  input-hover-line-color: "#f99e1a"
  input-dropdown-icon-color: "#9aa6bd"
  chip-background-color: "#1c2638"
  label-badge-background-color: "#151d2c"
  label-badge-text-color: "#f3f6fb"
  data-table-background-color: "#151d2c"
  table-header-background-color: "#0b111c"
  table-row-background-color: "#151d2c"
  table-row-alternative-background-color: "#1c2638"
  markdown-code-background-color: "#0b111c"
